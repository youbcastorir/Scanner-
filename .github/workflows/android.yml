name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # إعداد الجافا بدون كاش نهائياً لتفادي هذا الخطأ المتكرر
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # توليد ملف Keystore الافتراضي تلقائياً
    - name: Generate Debug Keystore
      run: |
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        find . -type d -name "app" -exec cp debug.keystore {}/ \; 2>/dev/null || true
        find . -type d -name "android" -exec cp debug.keystore {}/ \; 2>/dev/null || true

    # البحث عن ملف البناء وتشغيله أينما كان مكان المشروع
    - name: Build with Gradle
      run: |
        GRADLEW_PATH=$(find . -name gradlew -print -quit)
        if [ -n "$GRADLEW_PATH" ]; then
          cd $(dirname "$GRADLEW_PATH")
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
        else
          # إذا لم يجد gradlew يبحث عن مجلد يحتوي build.gradle وينفذ البناء العام
          BUILD_PATH=$(find . -name build.gradle -print -quit)
          if [ -n "$BUILD_PATH" ]; then
            cd $(dirname "$BUILD_PATH")
            gradle assembleDebug --no-daemon
          else
            echo "Error: No Android project files found in this repository."
            exit 1
          fi
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          **/build/outputs/apk/debug/*.apk
          
